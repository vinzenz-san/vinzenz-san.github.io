<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vinzenz – Software & Web Extensions</title>
    <!-- Tailwind CSS per CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-200 min-h-screen flex flex-col justify-between p-6 font-sans antialiased">

    <!-- Hauptinhalt -->
    <main class="max-w-xl mx-auto w-full my-auto py-12">
        
        <!-- Header / Mini-Bio -->
        <header class="mb-10">
            <h1 class="text-3xl font-bold tracking-tight text-white mb-2">Vinzenz</h1>
            <p class="text-slate-400 text-base leading-relaxed">
                Tinkering with web tools and browser extensions to solve everyday tasks.
            </p>
        </header>

        <!-- (StartGrid) -->
        <section class="mb-10">
            <h2 class="text-xs font-semibold uppercase tracking-wider text-slate-500 mb-4">Projects</h2>
            
            <!-- Projekt-Karte -->
            <a href="/StartGrid/" class="block p-5 rounded-xl border border-slate-800 bg-slate-900/50 hover:bg-slate-900 hover:border-slate-700 transition-all group">
                <div class="flex items-center justify-between mb-2">
                    <h3 class="font-semibold text-white group-hover:text-emerald-400 transition-colors">StartGrid</h3>
                    <span class="text-xs bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-2 py-0.5 rounded-full font-medium">Browser Extension</span>
                </div>
                <p class="text-sm text-slate-400 mb-3">
                     Turn your new tab into a customizable widget grid — clock, weather, bookmarks, notes, and live wallpapers. All local. 
                </p>
                <div class="text-xs text-slate-500 flex items-center gap-1 font-medium group-hover:translate-x-1 transition-transform">
                    View Project Page &rarr;
                </div>
            </a>
        </section>

        <!-- GitHub Link Button -->
        <section class="mb-12">
            <a href="https://github.com/vinzenz-san" target="_blank" rel="noopener noreferrer" 
               class="inline-flex items-center gap-2 px-4 py-2.5 rounded-lg border border-slate-800 bg-slate-900 text-sm font-medium text-slate-300 hover:text-white hover:bg-slate-800 hover:border-slate-700 transition-all">
                <!-- GitHub Icon -->
                <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24">
                    <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/>
                </svg>
                Find me on GitHub
            </a>
        </section>

    </main>

    <footer class="max-w-xl mx-auto w-full border-t border-slate-900 pt-6 text-xs text-slate-600 flex justify-end items-center">
        <div class="flex gap-4">
            <a href="https://github.com/vinzenz-san" class="hover:text-slate-400 transition-colors">GitHub</a>
        </div>
    </footer>

</body>
</html>
